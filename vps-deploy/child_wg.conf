# =============================================================================
# CẤU HÌNH WIREGUARD CLIENT CHO MÁY CỦA CON (CHILD DEVICE)
# Nạp file này vào ứng dụng WireGuard trên iOS, Android, macOS hoặc Windows của con.
# =============================================================================
[Interface]
PrivateKey = <CHILD_PRIVATE_KEY>
Address = 10.0.0.2/24
# Ép buộc mọi phân giải DNS phải đi qua Lõi Lọc FamilyGuard trên VPS
DNS = 10.0.0.1

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
# Địa chỉ IP Public của VPS và cổng WireGuard
Endpoint = 103.74.101.176:51820
# Bắt buộc chuyển hướng (Force-route) toàn bộ lưu lượng qua VPN
AllowedIPs = 0.0.0.0/0, ::/0
# Giữ kết nối liên tục khi chuyển mạng Wi-Fi / 4G (Roaming)
PersistentKeepalive = 25
