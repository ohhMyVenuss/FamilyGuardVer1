# =============================================================================
# CẤU HÌNH WIREGUARD SERVER TRÊN VPS (/etc/wireguard/wg0.conf)
# =============================================================================
[Interface]
Address = 10.0.0.1/24
ListenPort = 51820
PrivateKey = <SERVER_PRIVATE_KEY_SE_DUOC_TAO_TU_DONG>
# Cấu hình NAT/iptables để cho phép các client truy cập Internet qua VPS
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# -----------------------------------------------------------------------------
# PEER 1: THIẾT BỊ CỦA CON (CHILD DEVICE - SMARTPHONE / LAPTOP)
# -----------------------------------------------------------------------------
[Peer]
# Tên: Máy con (Child)
PublicKey = <CHILD_PUBLIC_KEY>
AllowedIPs = 10.0.0.2/32

# -----------------------------------------------------------------------------
# PEER 2: THIẾT BỊ CỦA PHỤ HUYNH (PARENT DESKTOP JAVAFX)
# -----------------------------------------------------------------------------
[Peer]
# Tên: Máy bố mẹ (Parent)
PublicKey = <PARENT_PUBLIC_KEY>
AllowedIPs = 10.0.0.3/32
